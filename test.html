<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competency Test &mdash; TRUSTUS Care</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/favicon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,Arial,sans-serif;background:#f8f9fa;color:#1C2B4A;min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid #eee;padding:14px 24px;display:flex;align-items:center;gap:12px}
.top-bar img{height:36px}
.top-bar .title{font-size:1rem;font-weight:700;color:#1C2B4A}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
#loadScreen,#errorScreen,#doneScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px}
#testScreen{display:none}
.state-icon{font-size:3rem}
.state-title{font-size:1.4rem;font-weight:800;color:#1C2B4A}
.state-sub{color:#555;font-size:0.95rem;max-width:480px;line-height:1.7}
.candidate-banner{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px 22px;margin-bottom:28px;display:flex;align-items:center;gap:14px}
.candidate-avatar{width:44px;height:44px;border-radius:50%;background:#C8526A;color:#fff;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.candidate-info .name{font-weight:800;font-size:1rem;color:#1C2B4A}
.candidate-info .role{font-size:0.83rem;color:#777;margin-top:2px}
.progress-bar{height:6px;background:#eee;border-radius:3px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:#C8526A;border-radius:3px;transition:width 0.3s}
.section-label{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#C8526A;margin-bottom:6px}
.section-title{font-size:1.1rem;font-weight:800;color:#1C2B4A;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #f0f0f0}
.q-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:22px 24px;margin-bottom:14px;transition:border-color 0.2s}
.q-card.answered{border-color:#C8526A44}
.q-num{font-size:0.78rem;font-weight:700;color:#C8526A;margin-bottom:8px}
.q-text{font-size:0.95rem;font-weight:600;color:#1C2B4A;line-height:1.6;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:8px}
.opt-label{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:10px 14px;border-radius:8px;border:1.5px solid #e5e7eb;transition:border-color 0.15s,background 0.15s;font-size:0.88rem;line-height:1.5}
.opt-label:hover{border-color:#C8526A;background:#fdf2f4}
.opt-label.selected{border-color:#C8526A;background:#fdf2f4}
.opt-label input[type=radio]{width:16px;height:16px;accent-color:#C8526A;flex-shrink:0;margin-top:2px}
.opt-key{font-weight:700;color:#C8526A;min-width:14px}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:28px;gap:12px;flex-wrap:wrap}
.btn-nav{padding:12px 28px;border-radius:50px;font-family:Nunito,Arial,sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;border:none;transition:background 0.2s,transform 0.2s}
.btn-back{background:#f3f4f6;color:#374151}
.btn-back:hover{background:#e5e7eb}
.btn-next{background:#C8526A;color:#fff}
.btn-next:hover{background:#b04059;transform:translateY(-1px)}
.btn-next:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.unanswered-note{font-size:0.82rem;color:#C8526A;text-align:center;margin-top:10px;display:none}
.score-card{background:#fff;border-radius:16px;border:1px solid #eee;padding:32px;margin-bottom:24px;text-align:center}
.score-big{font-size:3.5rem;font-weight:800;line-height:1}
.score-label{font-size:1rem;font-weight:700;margin-top:6px}
.score-threshold{font-size:0.82rem;color:#777;margin-top:4px}
.score-pass{color:#166534}.score-fail{color:#991b1b}
.section-results{background:#fff;border-radius:12px;border:1px solid #eee;overflow:hidden}
.sr-row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #f0f0f0;font-size:0.88rem}
.sr-row:last-child{border-bottom:none}
.sr-name{color:#374151}.sr-score{font-weight:700;color:#1C2B4A}
@media(max-width:480px){.wrap{padding:20px 14px 80px}.q-card{padding:16px}.btn-nav{padding:11px 20px}}
</style>
</head>
<body>

<div class="top-bar">
  <img src="images/logo.png" alt="TRUSTUS Care">
  <span class="title">Pre-Interview Competency Test</span>
</div>

<div class="wrap">

<div id="loadScreen">
  <div class="state-icon">&#8987;</div>
  <div class="state-title">Loading your test&hellip;</div>
</div>

<div id="errorScreen" style="display:none">
  <div class="state-icon">&#9888;</div>
  <div class="state-title" id="errTitle">Link not valid</div>
  <div class="state-sub" id="errMsg">This test link is not valid. Please contact TRUSTUS Care on 020 3411 1218.</div>
</div>

<div id="testScreen" style="display:none">
  <div class="candidate-banner">
    <div class="candidate-avatar" id="candidateInitial">?</div>
    <div class="candidate-info">
      <div class="name" id="candidateName"></div>
      <div class="role" id="candidateRole"></div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="sectionContent"></div>
  <div class="nav-row">
    <button class="btn-nav btn-back" id="btnBack" onclick="prevSection()" style="display:none">&#8592; Back</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="nextSection()">Next &rarr;</button>
  </div>
  <p class="unanswered-note" id="unansweredNote">Please answer all questions before continuing.</p>
</div>

<div id="doneScreen" style="display:none">
  <div id="doneContent" style="width:100%;max-width:600px"></div>
</div>

</div>

<script>
const EDGE_BASE = 'https://ssbcpblfkgpgtcxifopp.supabase.co/functions/v1'
const KEYS = ['a','b','c','d']
const TOKEN = new URLSearchParams(location.search).get('token')
let _firstName = ''
let _sectionIdx = 0
let _answers = {}

const SECTIONS = [
  { key:'core_values', name:'Core Values &amp; Professional Boundaries', questions:[
    { t:'A client asks you to use their debit card to buy groceries. What is the correct action?',
      o:['Take the card and go shopping without asking anyone.','Contact your office manager to report it and get authorisation.','Refuse to help them and leave them with no food.','Keep the card for your own personal use.'] },
    { t:'How do you show the TRUSTUS Care value of \u201cPromoting Independence\u201d?',
      o:['Do everything for the client so they do not have to move.','Give the client an easy-grip tool and encourage them to do what they can.','Tell the client they are too slow and take over their tasks.','Ignore the client\u2019s requests entirely.'] },
    { t:'What is an example of person-centred care?',
      o:['Forcing every client to wake up at exactly 6:00 AM.','Planning care around the client\u2019s specific personal preferences.','Making choices for the client without asking them.','Ignoring the client\u2019s cultural or religious background.'] },
    { t:'Under the Mental Capacity Act, what must you assume when meeting a client?',
      o:['Assume they cannot make any decisions on their own.','Assume they have full capacity unless a formal test shows otherwise.','Assume their family makes 100% of their choices.','Assume the care worker makes all their legal choices.'] }
  ]},
  { key:'safeguarding', name:'Safeguarding &amp; Risk Management', questions:[
    { t:'You notice large, unexplained hand-shaped bruises on a client\u2019s arm. What should you do?',
      o:['Shout at the family members immediately.','Write it down factually and report it to your Safeguarding Lead immediately.','Hide it and tell nobody to keep things quiet.','Delete the care records and ignore the bruises.'] },
    { t:'You think a coworker is asking a client with a learning disability for cash \u201cloans\u201d. What is your duty?',
      o:['Mind your own business and do nothing.','Follow the Whistleblowing Policy to report the coworker to management.','Ask the coworker to split the money with you.','Tell the client to give away more money.'] },
    { t:'Which of the following is an example of organisational abuse?',
      o:['A client choosing to watch TV in their own bedroom.','Forcing all clients to go to bed early just to suit the staff shift change.','A care worker arriving five minutes late due to heavy traffic.','Serving lunch at 12:45 PM instead of exactly at 12:30 PM.'] },
    { t:'A client with autism runs toward heavy traffic when stressed. How should the team manage this risk?',
      o:['Lock the client in a room and never let them go outside.','Use a safe, proactive plan with travel training and calming aids.','Put the client in tight physical restraints all day.','Let the client run into the street alone.'] }
  ]},
  { key:'medication', name:'Medication &amp; Infection Control', questions:[
    { t:'A client who has full legal capacity refuses to take their evening medication. What should you do?',
      o:['Crush the pill and secretly hide it in their pudding.','Force their mouth open and make them swallow it.','Respect their choice, explain risks, record the refusal, and tell your manager.','Punish the client by taking away their television privileges.'] },
    { t:'When giving medication, what is a critical safety rule?',
      o:['Follow the \u201c6 Rights\u201d \u2014 Right person, medication, route, dose, time, documentation.','Pre-sign the medication chart before you even arrive at the house.','Leave the pills on the bedside table for a sleeping client to take later.','Guess the dosage if you cannot read the prescription label clearly.'] },
    { t:'What is the correct rule for disposable gloves and aprons?',
      o:['Use the exact same pair of gloves for every single house you visit.','Change your gloves and apron between doing personal care and preparing food.','Wash disposable aprons in the sink so you can reuse them all week.','Never wear any gloves or aprons under any circumstances.'] },
    { t:'You have active symptoms of infectious vomiting and diarrhoea. What should you do?',
      o:['Go to your shifts normally and tell nobody.','Stay home, call the office immediately, and follow infection control rules.','Bring a friend along to do your personal care work for you.','Work your shift but try to avoid looking directly at the clients.'] }
  ]},
  { key:'emergency', name:'Emergency Situations &amp; Health and Safety', questions:[
    { t:'You find a client lying motionless on their living room floor. What is your very first action?',
      o:['Pull them up roughly by their arms to stand up.','Check the area for danger, see if they respond, and check if they are breathing.','Pour a hot cup of tea down their throat immediately.','Run out of the house and ignore the situation completely.'] },
    { t:'A client\u2019s care plan says they need a two-person hoist transfer. You are completely alone. What should you do?',
      o:['Do the hoist transfer completely by yourself to save time.','Manually lift the client using your back, bypassing the hoist completely.','Wait for your second care worker or call the office immediately for support.','Scream at the client for needing assistance.'] },
    { t:'You are running 30 minutes late for a morning visit due to a major transit delay. What should you do?',
      o:['Speed and break driving laws to rush down the street.','Call your office immediately so they can update the client or send a replacement.','Skip the visit completely and pretend you went on the digital system.','Do not worry and show up whenever you feel like it.'] }
  ]},
  { key:'communication', name:'Learning Disabilities, Dementia &amp; Communication', questions:[
    { t:'An autistic resident starts rocking, pacing, and humming loudly. How should you react?',
      o:['Shout at them to stop and force them to sit perfectly still.','Turn down loud TVs, dim harsh lights, and follow their behaviour support plan.','Pin them to the floor with a heavy physical restraint hold.','Laugh at them and mock the noises they are making.'] },
    { t:'What is \u201cdiagnostic overshadowing\u201d in learning disability support work?',
      o:['Blaming physical illness symptoms (like pain or a UTI) on the client\u2019s learning disability.','Using a flashlight to check a client\u2019s eyes during a checkup.','Giving a client too many physical exercise options.','Teaching a client how to cook meals independently.'] },
    { t:'A client with advanced dementia angrily claims you stole their wedding ring. How should you respond?',
      o:['Scream back at them, call them a liar, and demand a written apology.','Stay calm, acknowledge their distress, and offer to look for the ring together.','Call emergency police forces to report the client for defamation.','Storm out of the house and leave the front doors wide open.'] },
    { t:'Which daily log entry is written to professional care standards?',
      o:['\u201cThe client was an absolute nightmare today and acted extremely lazy.\u201d','\u201cThe client is sad because their family doesn\u2019t love them enough to visit.\u201d','\u201cArrived 13:00. Client took lunch medication. Ate full meal. Mood was settled.\u201d','\u201cClient threw a giant temper tantrum for no clear reason whatsoever.\u201d'] },
    { t:'Why must you keep client information strictly confidential under UK GDPR law?',
      o:['To prevent care workers from talking to their managers about schedules.','To build professional trust and protect vulnerable clients from scams or stigma.','To allow the company to take over all personal social media accounts of staff.','To keep the client\u2019s own family from knowing if they are safe.'] }
  ]}
]

function globalIdx(si, li) {
  let g = 0; for (let i = 0; i < si; i++) g += SECTIONS[i].questions.length; return g + li
}
function totalQ() { return SECTIONS.reduce((n,s) => n + s.questions.length, 0) }
function answeredCount() { return Object.keys(_answers).length }

async function init() {
  if (!TOKEN) { showError('Invalid Link','No test token found in this URL.'); return }
  try {
    const res = await fetch(EDGE_BASE + '/validate-token?token=' + TOKEN)
    const d = await res.json()
    if (!d.valid) { showError('Link Not Valid','This link is not valid. Please contact TRUSTUS Care on 020 3411 1218.'); return }
    if (d.status !== 'interview_invited') {
      showError('Test Not Available','This test is not currently available. Please contact TRUSTUS Care on 020 3411 1218.'); return
    }
    _firstName = d.firstName
    document.getElementById('candidateInitial').textContent = d.firstName.charAt(0).toUpperCase()
    document.getElementById('candidateName').textContent = d.firstName
    document.getElementById('candidateRole').textContent = d.roleApplied
    document.getElementById('loadScreen').style.display = 'none'
    document.getElementById('testScreen').style.display = 'block'
    renderSection()
  } catch(e) { showError('Error','Could not load test. Please try again or call 020 3411 1218.') }
}

function showError(title, msg) {
  document.getElementById('loadScreen').style.display = 'none'
  document.getElementById('errTitle').textContent = title
  document.getElementById('errMsg').textContent = msg
  document.getElementById('errorScreen').style.display = 'flex'
}

function renderSection() {
  const s = SECTIONS[_sectionIdx]
  const isLast = _sectionIdx === SECTIONS.length - 1
  document.getElementById('progressFill').style.width = (answeredCount() / totalQ() * 100) + '%'
  document.getElementById('btnBack').style.display = _sectionIdx > 0 ? 'block' : 'none'
  const btn = document.getElementById('btnNext')
  btn.textContent = isLast ? 'Submit Test' : 'Next \u2192'
  btn.disabled = false

  let html = '<div class="section-label">Section ' + (_sectionIdx+1) + ' of ' + SECTIONS.length + '</div>'
             + '<div class="section-title">' + s.name + '</div>'

  s.questions.forEach((q, li) => {
    const gi = globalIdx(_sectionIdx, li)
    const sel = _answers[gi]
    html += '<div class="q-card' + (sel !== undefined ? ' answered' : '') + '" id="qcard-' + gi + '">'
          + '<div class="q-num">Question ' + (gi+1) + '</div>'
          + '<div class="q-text">' + q.t + '</div><div class="options">'
    q.o.forEach((opt, oi) => {
      const k = KEYS[oi]
      const isSel = sel === k
      html += '<label class="opt-label' + (isSel ? ' selected' : '') + '" onclick="pick(' + gi + ',\'' + k + '\',this)">'
            + '<input type="radio" name="q' + gi + '" value="' + k + '"' + (isSel ? ' checked' : '') + '>'
            + '<span class="opt-key">' + k.toUpperCase() + '.</span><span>' + opt + '</span></label>'
    })
    html += '</div></div>'
  })

  document.getElementById('sectionContent').innerHTML = html
  document.getElementById('unansweredNote').style.display = 'none'
  window.scrollTo({top:0,behavior:'smooth'})
}

function pick(gi, key, labelEl) {
  _answers[gi] = key
  const card = document.getElementById('qcard-' + gi)
  if (card) {
    card.classList.add('answered')
    card.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'))
    card.querySelectorAll('input[type=radio]').forEach(r => r.checked = false)
  }
  labelEl.classList.add('selected')
  labelEl.querySelector('input').checked = true
  document.getElementById('progressFill').style.width = (answeredCount() / totalQ() * 100) + '%'
}

function sectionDone() {
  const s = SECTIONS[_sectionIdx]
  for (let li = 0; li < s.questions.length; li++) {
    if (_answers[globalIdx(_sectionIdx, li)] === undefined) return false
  }
  return true
}

function nextSection() {
  if (!sectionDone()) { document.getElementById('unansweredNote').style.display = 'block'; return }
  document.getElementById('unansweredNote').style.display = 'none'
  if (_sectionIdx < SECTIONS.length - 1) { _sectionIdx++; renderSection() } else { submitTest() }
}

function prevSection() { if (_sectionIdx > 0) { _sectionIdx--; renderSection() } }

async function submitTest() {
  const btn = document.getElementById('btnNext')
  btn.disabled = true; btn.textContent = 'Submitting\u2026'
  const answers = []
  for (let i = 0; i < totalQ(); i++) answers.push(_answers[i] || '')
  try {
    const res = await fetch(EDGE_BASE + '/submit-mcq', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, answers })
    })
    const d = await res.json()
    if (!res.ok) throw new Error(d.error || 'HTTP ' + res.status)
    showResults(d.score, d.passed, d.section_scores)
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Submit Test'
    const note = document.getElementById('unansweredNote')
    note.textContent = 'Submission failed: ' + e.message
    note.style.display = 'block'
  }
}

function showResults(score, passed, ss) {
  document.getElementById('testScreen').style.display = 'none'
  document.getElementById('doneContent').innerHTML =
    '<div style="background:#fff;border-radius:16px;border:1px solid #eee;padding:40px 32px;text-align:center">'
    + '<div style="font-size:3rem;margin-bottom:16px">&#10003;</div>'
    + '<div style="font-size:1.4rem;font-weight:800;color:#1C2B4A;margin-bottom:10px">Test Submitted</div>'
    + '<p style="color:#555;font-size:0.95rem;line-height:1.7;max-width:400px;margin:0 auto">'
    + 'Thank you, ' + _firstName + '. Your answers have been submitted to TRUSTUS Care.<br><br>'
    + 'You will be contacted regarding your application. If you have any questions, please call us on <strong>020 3411 1218</strong>.</p>'
    + '</div>'
  document.getElementById('doneScreen').style.display = 'flex'
}

init()
</script>
</body>
</html>
