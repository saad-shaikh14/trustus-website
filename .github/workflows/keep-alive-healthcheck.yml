name: Supabase Keep-Alive & Health Check

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC — well under Supabase's 7-day pause window
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ssbcpblfkgpgtcxifopp.supabase.co/rest/v1/trustus_applications?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzYmNwYmxma2dwZ3RjeGlmb3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzMxMTEsImV4cCI6MjA5ODMwOTExMX0.aAdKVdtWJHEFkFbmxlymENzXmGCZXJOoH4mgyCjXcKY" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzYmNwYmxma2dwZ3RjeGlmb3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzMxMTEsImV4cCI6MjA5ODMwOTExMX0.aAdKVdtWJHEFkFbmxlymENzXmGCZXJOoH4mgyCjXcKY")
          echo "http_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Health check returned HTTP $STATUS"

      - name: Alert if unhealthy
        if: steps.ping.outputs.http_status != '200'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"TRUSTUS Portal <noreply@trustuscare.com>\",
              \"to\": \"info@trustuscare.com\",
              \"subject\": \"TRUSTUS Portal Health Check Failed (HTTP ${{ steps.ping.outputs.http_status }})\",
              \"html\": \"<p>The daily automated health check for the TRUSTUS job portal database returned HTTP ${{ steps.ping.outputs.http_status }} instead of 200.</p><p>This usually means the Supabase project has paused or is unreachable — candidates may not be able to submit job applications until this is resolved.</p><p>To restore: log into <a href='https://supabase.com/dashboard/project/ssbcpblfkgpgtcxifopp'>the Supabase dashboard</a> and click Restore, or contact Saad.</p>\"
            }"
